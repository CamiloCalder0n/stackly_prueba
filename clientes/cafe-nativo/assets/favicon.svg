<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Café Nativo">
  <!-- Los dos colores son los tokens del sitio ya resueltos: --paper (el papel
       de lino tostado del body) y --ink (el negro cálido del texto). El punto
       magenta es --spot, el mismo acento que llevan los <em> del hero. -->
  <rect width="64" height="64" fill="#e6dcbc"/>
  <text x="32" y="46" text-anchor="middle"
        font-family="'Source Serif 4', Georgia, 'Times New Roman', serif"
        font-weight="600" font-size="46" fill="#261d1f">N</text>
  <circle cx="52" cy="14" r="5" fill="#aa0b56"/>
</svg>

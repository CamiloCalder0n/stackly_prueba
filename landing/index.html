<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f9e44" />

    <title>Stackly — Sitios web para negocios locales, sin cuota mensual</title>
    <meta
      name="description"
      content="Stackly diseña y desarrolla sitios web para negocios locales en Colombia: catálogo o menú indexable, contacto por WhatsApp y sin cuota mensual. El dominio, el código y los datos quedan a nombre del cliente."
    />
    <link rel="canonical" href="https://stackly.dev/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stackly" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://stackly.dev/" />
    <meta property="og:title" content="Stackly — Sitios web para negocios locales, sin cuota mensual" />
    <meta
      property="og:description"
      content="Diseñamos y desarrollamos sitios web para negocios locales en Colombia: catálogo o menú indexable, contacto por WhatsApp y sin cuota mensual."
    />
    <meta property="og:image" content="https://stackly.dev/portfolio/joyeria-portada.jpg" />
    <meta property="og:image:width" content="1400" />
    <meta property="og:image:height" content="875" />
    <meta property="og:image:alt" content="Portada de un sitio de joyería construido con una plantilla de Stackly" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stackly — Sitios web para negocios locales, sin cuota mensual" />
    <meta
      name="twitter:description"
      content="Diseñamos y desarrollamos sitios web para negocios locales en Colombia: catálogo o menú indexable, contacto por WhatsApp y sin cuota mensual."
    />
    <meta name="twitter:image" content="https://stackly.dev/portfolio/joyeria-portada.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Stackly",
        "url": "https://stackly.dev/",
        "email": "hola@stackly.dev",
        "description": "Agencia colombiana de diseño y desarrollo web para negocios locales: sitios estáticos rápidos, catálogo o menú indexable en HTML y conversión por WhatsApp, sin cuota mensual.",
        "logo": "https://stackly.dev/favicon.svg",
        "image": "https://stackly.dev/portfolio/joyeria-portada.jpg",
        "knowsLanguage": "es-CO",
        "areaServed": [
          { "@type": "Country", "name": "Colombia" },
          { "@type": "City", "name": "Bucaramanga" }
        ],
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "hola@stackly.dev",
            "availableLanguage": "Spanish",
            "areaServed": "CO"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

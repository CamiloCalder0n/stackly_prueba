<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f9e44" />

    <title>Stackly — Sitios web para negocios locales, sin cuota mensual</title>
    <meta
      name="description"
      content="Stackly diseña y desarrolla sitios web para negocios locales en Colombia: catálogo o menú indexable, contacto por WhatsApp y sin cuota mensual. El dominio, el código y los datos quedan a nombre del cliente."
    />
    <!-- Stackly todavía no tiene dominio propio: estas URLs absolutas apuntan
         al subdominio de Vercel porque es la única dirección que responde de
         verdad. Al comprar el dominio hay que cambiarlas aquí, en og:url,
         og:image, twitter:image y en las tres del JSON-LD. -->
    <link rel="canonical" href="https://landing-eta-henna-tskpy72wa0.vercel.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stackly" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://landing-eta-henna-tskpy72wa0.vercel.app/" />
    <meta property="og:title" content="Stackly — Sitios web para negocios locales, sin cuota mensual" />
    <meta
      property="og:description"
      content="Diseñamos y desarrollamos sitios web para negocios locales en Colombia: catálogo o menú indexable, contacto por WhatsApp y sin cuota mensual."
    />
    <meta property="og:image" content="https://landing-eta-henna-tskpy72wa0.vercel.app/portfolio/joyeria-portada.jpg" />
    <meta property="og:image:width" content="1400" />
    <meta property="og:image:height" content="875" />
    <meta property="og:image:alt" content="Portada de un sitio de joyería construido con una plantilla de Stackly" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stackly — Sitios web para negocios locales, sin cuota mensual" />
    <meta
      name="twitter:description"
      content="Diseñamos y desarrollamos sitios web para negocios locales en Colombia: catálogo o menú indexable, contacto por WhatsApp y sin cuota mensual."
    />
    <meta name="twitter:image" content="https://landing-eta-henna-tskpy72wa0.vercel.app/portfolio/joyeria-portada.jpg" />

    <!-- Sin `email` ni `contactPoint` a propósito: el correo que había aquí
         rebotaba (dominio sin registros MX, y además de otra empresa), y un
         correo muerto en datos estructurados es peor que ninguno porque Google
         lo indexa y se lo ofrece a la gente. Al tener buzón propio, añadir
         "email" y un contactPoint de tipo "sales". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Stackly",
        "url": "https://landing-eta-henna-tskpy72wa0.vercel.app/",
        "description": "Agencia colombiana de diseño y desarrollo web para negocios locales: sitios estáticos rápidos, catálogo o menú indexable en HTML y conversión por WhatsApp, sin cuota mensual.",
        "logo": "https://landing-eta-henna-tskpy72wa0.vercel.app/favicon.svg",
        "image": "https://landing-eta-henna-tskpy72wa0.vercel.app/portfolio/joyeria-portada.jpg",
        "knowsLanguage": "es-CO",
        "areaServed": [
          { "@type": "Country", "name": "Colombia" },
          { "@type": "City", "name": "Bucaramanga" }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Todo el contenido vive en el bundle de React. Si no carga —proxy
         corporativo, extensión, CDN caído— el visitante veía una página en
         blanco, sin siquiera el nombre de la empresa. Esto es el mínimo para
         que sepa quién somos y cómo escribirnos. -->
    <noscript>
      <div style="max-width:34rem;margin:0 auto;padding:3rem 1.5rem;font-family:system-ui,sans-serif;color:#111827;line-height:1.6">
        <h1 style="font-size:1.6rem;margin:0 0 .75rem">Stackly</h1>
        <p style="margin:0 0 1rem">
          Diseñamos y desarrollamos sitios web para negocios locales en Colombia:
          catálogo o menú indexable, contacto por WhatsApp y sin cuota mensual.
          El dominio, el código y los datos quedan a tu nombre.
        </p>
        <p style="margin:0 0 1rem">
          Esta página necesita JavaScript para mostrarse completa. Si no puedes
          activarlo, escríbenos y te respondemos igual.
        </p>
        <p style="margin:0">
          <a href="/privacidad.html" style="color:#257c35">Política de privacidad</a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
